services:
  - type: web
    name: nexora-website
    runtime: node
    buildCommand: npm ci --registry=https://registry.npmjs.org && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NEXORA_EMAIL_FROM
        sync: false
      - key: NEXORA_LEAD_NOTIFICATION_EMAIL
        sync: false
      - key: NEXORA_GENERAL_COMMUNITY_URL
        sync: false
      - key: NEXORA_AMBASSADOR_COMMUNITY_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: AIRTABLE_BASE_ID
        sync: false
      - key: AIRTABLE_TOKEN
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        value: https://www.nexoragroup.ink
